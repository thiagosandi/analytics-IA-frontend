<div class="dashboard-container">

  <h1>Bem vindo ao Painel de controle</h1>
  <h2>Visualize os resultados mais assertivos</h2>

  <mat-grid-list cols="2" rowHeight="390px">

    <!-- CARD 1 - Line Chart -->
    <mat-grid-tile>
      <mat-card>
        <mat-card-title>Usuários Ativos</mat-card-title>
        <div class="chart-wrapper">
          <google-chart
            class="chart"
            [type]="lineChartType"
            [data]="lineChartData"
            [columns]="lineChartColumns"
            [options]="lineChartOptions">
          </google-chart>
        </div>
      </mat-card>
    </mat-grid-tile>

    <!-- CARD 2 - Bar Chart -->
    <mat-grid-tile>
      <mat-card>
        <mat-card-title>Acessos por Dia</mat-card-title>
        <div class="chart-wrapper">
          <google-chart
            class="chart"
            [type]="barChartType"
            [data]="barChartData"
            [columns]="barChartColumns"
            [options]="barChartOptions">
          </google-chart>
        </div>
      </mat-card>
    </mat-grid-tile>

    <!-- CARD 3 - Pie Chart -->
    <mat-grid-tile>
      <mat-card>
        <mat-card-title>Distribuição de Dispositivos</mat-card-title>
        <div class="chart-wrapper">
          <google-chart
            class="chart"
            [type]="pieChartType"
            [data]="pieChartData"
            [columns]="pieChartColumns"
            [options]="pieChartOptions">
          </google-chart>
        </div>
      </mat-card>
    </mat-grid-tile>

    <!-- CARD 4 - Area Chart -->
    <mat-grid-tile>
      <mat-card>
        <mat-card-title>Performance Mensal</mat-card-title>
        <div class="chart-wrapper">
          <google-chart
            class="chart"
            [type]="areaChartType"
            [data]="areaChartData"
            [columns]="areaChartColumns"
            [options]="areaChartOptions">
          </google-chart>
        </div>
      </mat-card>
    </mat-grid-tile>

  </mat-grid-list>

</div>
